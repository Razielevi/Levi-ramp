<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Levi Ramp</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #ffc107;
            margin: 10px 0;
            font-size: 28px;
            text-align: center;
        }
        .status-box {
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 15px;
            background: #1e1e1e;
        }
        .status-text {
            color: #4caf50;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .btn-main {
            background-color: #1e1e1e;
            color: #ffc107;
            border: 2px solid #ffc107;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: center;
        }
        .btn-main:active {
            background-color: #ffc107;
            color: #121212;
        }
        .joystick-container {
            position: relative;
            width: 320px;
            height: 320px;
            background: #1a1a1a;
            border-radius: 50%;
            border: 3px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .control-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            border: 2px solid #555;
            background: #2c2c2c;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .control-btn:active, .control-btn.active {
            background: #ffc107;
            color: #121212;
            border-color: #fff;
        }
        #btn-up { top: 15px; left: 120px; border-color: #ffc107; }
        #btn-down { bottom: 15px; left: 120px; border-color: #ffc107; }
        #btn-open { right: 15px; top: 120px; border-color: #2196F3; } /* ממסר 1 - ימין */
        #btn-close { left: 15px; top: 120px; border-color: #FF5722; } /* ממסר 2 - שמאל */
        #btn-stop {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #d32f2f;
            border: 2px solid #ff8a80;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
        }
        #btn-stop:active {
            background: #ff5252;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            border: 2px solid #ffc107;
            text-align: right;
        }
        .modal-content select, .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Levi Ramp</h1>
    
    <div class="status-box">
        <div id="status-display" class="status-text">ממתין לחיבור בלוטות'...</div>
        <div style="font-size: 12px; color: #aaa;" id="pin-status">Security PIN: נעול</div>
    </div>

    <button class="btn-main" onclick="toggleConnection()">חיבור Bluetooth</button>
    <button class="btn-main" onclick="openSettings()">⚙️ הגדרות מערכת (שפות / מודולים)</button>

    <div class="joystick-container">
        <div class="control-btn" id="btn-up" ontouchstart="sendCommand('UP')" onmousedown="sendCommand('UP')">
            <span>▲</span>עליה
        </div>
        <div class="control-btn" id="btn-open" ontouchstart="sendCommand('OPEN')" onmousedown="sendCommand('OPEN')">
            <span>▶</span>פתיחה
        </div>
        <button id="btn-stop" onclick="sendCommand('STOP')">STOP</button>
        <div class="control-btn" id="btn-close" ontouchstart="sendCommand('CLOSE')" onmousedown="sendCommand('CLOSE')">
            <span>◀</span>סגירה
        </div>
        <div class="control-btn" id="btn-down" ontouchstart="sendCommand('DOWN')" onmousedown="sendCommand('DOWN')">
            <span>▼</span>ירידה
        </div>
    </div>

    <!-- מודאל הגדרות -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #ffc107; margin-top:0;">הגדרות מערכת</h3>
            
            <label>בחר שפה:</label>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="he">עברית</option>
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
            </select>

            <label>בחר סוג מודול בלוטות':</label>
            <select id="module-select">
                <option value="auto">זיהוי אוטומטי (Auto)</option>
                <option value="HM10">HM-10 / AT-09 (CC2541)</option>
                <option value="JDY">JDY-08 / JDY-16</option>
                <option value="ESP32">ESP32 / ESP8266 BLE</option>
                <option value="GENERIC">גנרי / אחר (Generic BLE)</option>
            </select>

            <button class="btn-main" style="margin-top: 15px;" onclick="closeSettings()">שמור וסגור</button>
        </div>
    </div>

    <div class="footer">
        LEVI RAMP - PROFESSIONAL SYSTEM<br>
        אריק לוי
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothServer;
        let bleCharacteristic;

        // UUIDs נפוצים למודולים
        const BLE_UUID = {
            service: '0000ffe0-0000-1000-8000-00805f9b34fb',
            characteristic: '0000ffe1-0000-1000-8000-00805f9b34fb'
        };

        function updateStatus(text, isConnected = false) {
            const display = document.getElementById('status-display');
            display.innerText = text;
            display.style.color = isConnected ? '#4caf50' : '#ff9800';
        }

        async function toggleConnection() {
            const selectedModule = document.getElementById('module-select').value;
            try {
                updateStatus("מחפש התקני בלוטות'...");
                
                let options = { acceptAllDevices: true };
                if (selectedModule !== 'GENERIC') {
                    options = {
                        filters: [{ services: [BLE_UUID.service] }],
                        optionalServices: [BLE_UUID.service]
                    };
                }

                bluetoothDevice = await navigator.bluetooth.requestDevice(options);
                bluetoothServer = await bluetoothDevice.gatt.connect();
                
                const service = await bluetoothServer.getPrimaryService(BLE_UUID.service);
                bleCharacteristic = await service.getCharacteristic(BLE_UUID.characteristic);
                
                updateStatus("מחובר בהצלחה למערכת הרמפה!", true);
            } catch (error) {
                console.log('Connection failed: ', error);
                updateStatus("החיבור נכשל או בוטל.");
            }
        }

        function sendCommand(action) {
            // מיפוי ממסרים:
            // OPEN = ממסר 1 (פתיחה - ימין)
            // CLOSE = ממסר 2 (סגירה - שמאל)
            // UP = ממסר 3 (למעלה)
            // DOWN = ממסר 4 (למטה)
            let cmd = '';
            switch(action) {
                case 'OPEN': cmd = 'RELAY_1_ON'; break;
                case 'CLOSE': cmd = 'RELAY_2_ON'; break;
                case 'UP': cmd = 'RELAY_3_ON'; break;
                case 'DOWN': cmd = 'RELAY_4_ON'; break;
                case 'STOP': cmd = 'STOP_ALL'; break;
            }
            
            console.WriteLine?.(cmd);
            if (bleCharacteristic) {
                const encoder = new TextEncoder();
                bleCharacteristic.writeValue(encoder.encode(cmd));
            }
        }

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function changeLanguage() {
            const lang = document.getElementById('lang-select').value;
            // אפשר להרחיב תרגומים כאן בהמשך לפי הצורך
        }
    </script>
</body>
</html>
