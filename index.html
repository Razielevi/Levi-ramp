
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Levi Ramp Control</title>
    <style>
        body { 
            margin: 0; 
            background-color: #121212; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh;
            /* מונע בחירת טקסט והעתקה בכל המסך */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        header { width: 100%; padding: 15px 0; text-align: center; background: #1e1e1e; }
        canvas { 
            background-color: #181818; 
            touch-action: none; /* מונע גלילה או התנהגות דפדפן בזמן לחיצה על הקנבס */
        }
        footer { margin-top: auto; padding: 10px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size: 18px; color: #ff9800;">Levi Ramp</h1>
        <div id="status" style="font-size: 12px; color: #888;">מנותק</div>
    </header>

    <canvas id="rampCanvas" width="360" height="500"></canvas>

    <footer>אריק לוי | 055-670-7209</footer>

    <script>
        const canvas = document.getElementById('rampCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        
        // הגדרת כפתורים במבנה של 2 עמודות, ללא חפיפה
        const buttons = [
            { id: 'connect', label: 'חיבור Bluetooth', x: 20, y: 10, w: 320, h: 50, color: '#2196F3' },
            // פתיחה מימין, סגירה משמאל
            { id: 'open', label: 'פתח (Open)', x: 185, y: 80, w: 155, h: 100, color: '#4CAF50', cmd: 'OPEN_CMD' },
            { id: 'close', label: 'סגור (Close)', x: 20, y: 80, w: 155, h: 100, color: '#f44336', cmd: 'CLOSE_CMD' },
            
            { id: 'up', label: 'עלייה', x: 185, y: 200, w: 155, h: 80, color: '#FF9800', cmd: 'UP_CMD' },
            { id: 'down', label: 'ירידה', x: 20, y: 200, w: 155, h: 80, color: '#FF9800', cmd: 'DOWN_CMD' },
            
            { id: 'relay5', label: 'ממסר ראשי #5', x: 20, y: 300, w: 320, h: 60, color: '#9C27B0', cmd: 'RELAY5_CMD' }
        ];

        let activeBtn = null;
        let isConnected = false;
        let bleChar = null;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            buttons.forEach(btn => {
                ctx.fillStyle = (activeBtn === btn.id) ? '#ffffff' : btn.color;
                ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(btn.label, btn.x + btn.w/2, btn.y + btn.h/2 + 6);
            });
        }

        async function connect() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{services: ['0000ffe0-0000-1000-8000-00805f9b34fb']}]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                bleChar = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                 isConnected = true;
                statusEl.innerText = 'מחובר!';
            } catch(e) { statusEl.innerText = 'שגיאת חיבור'; }
        }

        async function send(cmd, state) {
            if(!isConnected) return;
            const msg = cmd + '_' + state;
            try { await bleChar.writeValue(new TextEncoder().encode(msg)); } catch(e) {}
        }

        // מניעת התנהגויות ברירת מחדל של הדפדפן על הקנבס
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault(); // מונע בחירת טקסט / גרירה
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            
            buttons.forEach(btn => {
                if(x > btn.x && x < btn.x + btn.w && y > btn.y && y < btn.y + btn.h) {
                    activeBtn = btn.id;
                    if(btn.id === 'connect') connect();
                    else if(btn.cmd) send(btn.cmd, 'ON');
                    draw();
                }
            });
        });

        window.addEventListener('pointerup', (e) => {
            if(activeBtn) {
                const btn = buttons.find(b => b.id === activeBtn);
                if(btn && btn.cmd) send(btn.cmd, 'OFF'); // מפסיק ברגע עזיבת האצבע
                activeBtn = null;
                draw();
            }
        });
    
        draw();
    </script>
</body>
</html>
