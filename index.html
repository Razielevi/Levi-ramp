<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רמפת לוי - שלט בלוטות' מקצועי</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: Arial, sans-serif;
    background-color: #0f172a;
    color: #ffffff;
    text-align: center;
    margin: 0;
    padding: 12px;
    direction: rtl;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.card {
    background-color: #1e293b;
    border-radius: 20px;
    padding: 16px;
    max-width: 420px;
    width: 100%;
    margin: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    border: 1px solid #334155;
}
.truck-header {
    width: 100%;
    height: 130px;
    border-radius: 14px;
    object-fit: cover;
    border: 2px solid #00e676;
    margin-bottom: 10px;
}
h1 { font-size: 24px; color: #00e676; margin: 4px 0; }
p { font-size: 13px; color: #94a3b8; margin-top: 0; }
hr { border: none; border-top: 1px solid #334155; margin: 12px 0; }

input, select {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #475569;
    background-color: #0f172a;
    color: #fff;
    font-size: 15px;
    text-align: center;
    outline: none;
}
input:focus, select:focus { border-color: #00e676; }

button, .btn-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    margin: 6px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    text-decoration: none;
}

.btn-primary { background-color: #0284c7; color: #ffffff; }
.btn-secondary { background-color: #334155; color: #fff; }
.btn-settings { background-color: #64748b; color: #fff; font-size: 14px; padding: 10px; }
.btn-whatsapp { background-color: #f97316; color: #ffffff; font-size: 14px; padding: 12px; border: 1px solid #ea580c; box-shadow: 0 4px 8px rgba(249,115,22,0.3); }
.btn-call { background-color: #e11d48; color: #ffffff; font-size: 14px; padding: 10px; }

.hidden { display: none !important; }

.bt-status-box, .pin-status-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    font-weight: bold;
    font-size: 15px;
    padding: 10px;
    background-color: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    cursor: pointer;
}

/* עיגול השליטה המרכזי */
.control-circle {
    position: relative;
    width: 290px;
    height: 290px;
    background: #151c28;
    border: 3px solid #334155;
    border-radius: 50%;
    margin: 16px auto;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}

.ctrl-btn {
    position: absolute;
    width: 75px;
    height: 75px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid #d4af37;
    background: #252525;
    color: white;
    box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    transition: transform 0.1s;
}

.ctrl-btn:active, .ctrl-btn.active {
    background: #00e676;
    color: #000;
    transform: scale(0.95);
}

/* מיקום מדויק בכפתורים בעיגול: פתיחה בימין, סגירה בשמאל */
#btnUp { top: 12px; left: 107px; border-color: #00e676; }
#btnClose { top: 107px; left: 12px; border-color: #e74c3c; } /* סגירה בשמאל */
#btnStop { top: 107px; left: 107px; background: #c0392b; border-color: #e74c3c; border-radius: 50%; width: 75px; height: 75px; }
#btnOpen { top: 107px; right: 12px; border-color: #3498db; } /* פתיחה בימין */
#btnDown { bottom: 12px; left: 107px; border-color: #00e676; }

.emergency-bar {
    background-color: #900C3F;
    border: 2px solid #FF5733;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 0;
    box-shadow: 0 4px 8px rgba(255, 87, 51, 0.4);
}
.emergency-bar:active { background-color: #C70039; }

.settings-panel {
    background-color: #0f172a;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #0284c7;
    text-align: right;
    margin-bottom: 12px;
}
.settings-panel label { font-size: 13px; color: #cbd5e1; display: block; margin-top: 6px; }
</style>
</head>
<body>

<div class="card">
    <img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?auto=format&fit=crop&w=600&q=80" alt="רמפת משאית" class="truck-header">
    
    <h1>רמפת לוי</h1>
    <p id="t-subtitle">מערכת שליטה מקצועית לרמפה הידראולית</p>
    <hr>

    <!-- מסך 1: הזנת קוד סודי (PIN) -->
    <div id="loginSection">
        <h3 id="t-loginTitle">הזן קוד גישה</h3>
        <p id="t-passHint">קוד גישה ברירת מחדל: 1960</p>
        <input type="password" id="pinInput" placeholder="****" maxlength="8" inputmode="numeric">
        <button class="btn-primary" onclick="checkPin()" id="t-loginBtn">🔑 כניסה למערכת</button>
        <div id="loginError" style="color:#ff5252; margin-top:6px; font-size:14px;"></div>
    </div>

    <!-- מסך 2: בקרה, בלוטות' והגדרות -->
    <div id="controlSection" class="hidden">
        
        <!-- סטטוס קוד אבטחה ניתן ללחיצה -->
        <div class="pin-status-box" id="pinStatusBox" onclick="handlePinClick()">
            <span id="pinText">PIN אבטחה: פתוח (לחץ לנעילה/שינוי)</span>
        </div>

        <button class="btn-primary" onclick="connectBluetooth()" id="t-connectBt">📶 חיבור בלוטות' BLE</button>

        <div class="bt-status-box">
            <span id="btIcon">🔴</span>
            <span id="statusText">בלוטות' מנותק</span>
        </div>

        <button class="btn-settings" onclick="toggleSettings()" id="t-settingsBtn">⚙️ הגדרות מערכת (שפות / מודולים)</button>

        <!-- פאנל הגדרות מתקדם -->
        <div id="settingsPanel" class="settings-panel hidden">
            <h4 style="margin:0 0 8px 0; color:#0284c7; text-align:center;">הגדרות מודול ומערכת</h4>

            <label>שפה / Language:</label>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="he">עברית (Hebrew)</option>
                <option value="en">English (אנגלית)</option>
            </select>

            <label>פרוטוקול שידור (מצב מודול):</label>
            <select id="modeSelect" onchange="saveSettings()">
                <option value="TEXT_NL">טקסט עם NewLine (לדוגמה "1\r\n")</option>
                <option value="RELAY_A0">פרוטוקול סיני של 8 ממסרים (0xA0)</option>
                <option value="HEX">בייטים HEX פשוטים</option>
            </select>

            <label>ממסר ראשי #5 טריגר כפול:</label>
            <select id="relay5Select" onchange="saveSettings()">
                <option value="true">כן - הפעלת ממסר 5 עם כל פעולה</option>
                <option value="false">לא - מצב ממסר יחיד</option>
            </select>

            <button class="btn-secondary" style="padding:8px; margin-top:10px; font-size:14px;" onclick="toggleSettings()">סגור הגדרות</button>
        </div>

        <!-- פס עצירת חירום ייעודי -->
        <div class="emergency-bar" onclick="emergencyStop()">
            🚨 עצירת חירום / ניתוק מערכת
        </div>

        <hr>

        <!-- עיגול שליטה כיווני -->
        <div class="control-circle">
            <button class="ctrl-btn" id="btnUp">▲<br>עליה</button>
            <button class="ctrl-btn" id="btnClose">◄<br>סגירה</button>
            <button class="ctrl-btn" id="btnStop" onclick="sendStopCommand()">עצור</button>
            <button class="ctrl-btn" id="btnOpen">►<br>פתיחה</button>
            <button class="ctrl-btn" id="btnDown">▼<br>ירידה</button>
        </div>

        <hr>

        <!-- תמיכה והזמנות -->
        <div style="background:#0f172a; padding:10px; border-radius:10px; border:1px dashed #00e676; margin-top:10px;">
            <h4 style="margin:0 0 6px 0; color:#00e676; font-size:15px;">הזמנות ותמיכה טכנית</h4>
            <p style="margin:0 0 8px 0; color:#fff;">אריק לוי: 052-3401960</p>
            <a href="https://wa.me/972523401960?text=שלום,%20אני מעוניין בפרטים%20על%20מערכת%20הרמפה" target="_blank" class="btn-whatsapp">
                💬 לחץ כאן בוואטסאפ להזמנות ובירורים
            </a>
            <a href="tel:+972523401960" class="btn-link btn-call">📞 התקשרו עכשיו</a>
        </div>

    </div>
</div>

<script>
let DEFAULT_PIN = localStorage.getItem("levi_ramp_pin") || "1960";
let savedPIN = DEFAULT_PIN;
let workMode = localStorage.getItem("work_mode") || "TEXT_NL";
let useRelay5 = localStorage.getItem("use_relay5") !== "false";
let currentLang = localStorage.getItem("app_lang") || "he";
let activeChannel = 0;
let isLocked = true;

let bluetoothDevice = null;
let relayCharacteristic = null;

const translations = {
    he: {
        dir: "rtl",
        subtitle: "מערכת שליטה מקצועית לרמפה הידראולית",
        loginTitle: "הזן קוד גישה",
        passHint: "קוד גישה ברירת מחדל: 1960",
        loginBtn: "🔑 כניסה למערכת",
        connectBt: "📶 חיבור בלוטות' BLE",
        btDisconnected: "בלוטות' מנותק",
        btSearching: "מחפש התקן BLE...",
        btConnecting: "מתחבר...",
        btConnected: "מחובר בהצלחה למערכת!",
        btError: "שגיאת חיבור",
        wrongPin: "קוד גישה שגוי, נסה שוב"
    },
    en: {
        dir: "ltr",
        subtitle: "Professional Hydraulic Ramp Control System",
        loginTitle: "Enter Access PIN",
        passHint: "Default PIN: 1960",
        loginBtn: "🔑 Login",
        connectBt: "📶 Connect Bluetooth BLE",
        btDisconnected: "Bluetooth Disconnected",
        btSearching: "Searching for BLE device...",
        btConnecting: "Connecting...",
        btConnected: "Successfully Connected!",
        btError: "Connection Error",
        wrongPin: "Incorrect PIN, try again"
    }
};

// טעינת הגדרות לתוך הטפסים
document.getElementById("modeSelect").value = workMode;
document.getElementById("relay5Select").value = useRelay5 ? "true" : "false";
document.getElementById("langSelect").value = currentLang;

function changeLanguage(lang) {
    currentLang = translations[lang] ? lang : "he";
    const t = translations[currentLang];
    document.body.dir = t.dir;
    document.getElementById("t-subtitle").innerText = t.subtitle;
    document.getElementById("t-loginTitle").innerText = t.loginTitle;
    document.getElementById("t-passHint").innerText = t.passHint;
    document.getElementById("t-loginBtn").innerText = t.loginBtn;
    document.getElementById("t-connectBt").innerText = t.connectBt;
    if(!relayCharacteristic) {
        document.getElementById("statusText").innerText = t.btDisconnected;
    }
    localStorage.setItem("app_lang", currentLang);
}

function toggleSettings() {
    document.getElementById("settingsPanel").classList.toggle("hidden");
}

function saveSettings() {
    workMode = document.getElementById("modeSelect").value;
    useRelay5 = document.getElementById("relay5Select").value === "true";
    try {
        localStorage.setItem("work_mode", workMode);
        localStorage.setItem("use_relay5", useRelay5);
    } catch(e) {}
}

function checkPin() {
    const inputVal = document.getElementById("pinInput").value;
    const errorDiv = document.getElementById("loginError");
    const t = translations[currentLang];

    if (inputVal === savedPIN) {
        isLocked = false;
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("controlSection").classList.remove("hidden");
        updatePinDisplay();
    } else {
        errorDiv.innerText = t.wrongPin;
    }
}

function handlePinClick() {
    if (isLocked) {
        let entered = prompt("הקש קוד סודי:");
        if (entered === savedPIN) {
            isLocked = false;
            updatePinDisplay();
            alert("המערכת נפתחה לשימוש!");
        } else if (entered !== null) {
            alert("קוד שגוי!");
        }
    } else {
        let action = prompt("המערכת פתוחה. הקש 1 לנעילה מחדש, או 2 לשינוי קוד אישי:");
        if (action === '1') {
            isLocked = true;
            updatePinDisplay();
            alert("המערכת ננעלה.");
        } else if (action === '2') {
            let newPin = prompt("הכנס קוד אישי חדש (לפחות 4 ספרות):");
            if (newPin && newPin.length >= 4) {
                savedPIN = newPin;
                localStorage.setItem("levi_ramp_pin", savedPIN);
                alert("הקוד האישי עודכן בהצלחה!");
            } else if (newPin !== null) {
                alert("הקוד חייב להכיל לפחות 4 תווים.");
            }
        }
    }
}

function updatePinDisplay() {
    const pinText = document.getElementById('pinText');
    const pinBox = document.getElementById('pinStatusBox');
    if (isLocked) {
        pinText.innerText = "PIN אבטחה: נעול (לחץ להקשת קוד)";
        pinBox.style.borderColor = "#e74c3c";
    } else {
        pinText.innerText = "PIN אבטחה: פתוח (לחץ לנעילה/שינוי)";
        pinBox.style.borderColor = "#00e676";
    }
}

async function connectBluetooth() {
    const statusText = document.getElementById("statusText");
    const btIcon = document.getElementById("btIcon");
    const t = translations[currentLang];

    if (!navigator.bluetooth) {
        alert("הדפדפן שלך אינו תומך ב-Bluetooth. יש להשתמש ב-Google Chrome.");
        return;
    }

    try {
        statusText.innerText = t.btSearching;
        btIcon.innerText = "🟡";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb', '00001000-0000-1000-8000-00805f9b34fb']
        });

        statusText.innerText = t.btConnecting;
        const gattServer = await bluetoothDevice.gatt.connect();

        let relayService;
        try {
            relayService = await gattServer.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
        } catch (e) {
            relayService = await gattServer.getPrimaryService('00001000-0000-1000-8000-00805f9b34fb');
    if (isLocked) {
        alert("המערכת נעולה! יש להקיש קוד גישה תחילה.");
        return;
    }
    if (!relayCharacteristic) {
        alert("המערכת אינה מחוברת ב-Bluetooth!");
        return;
    }

    const encoder = new TextEncoder();

    if (workMode === "TEXT_NL") {
        let cmdStr = state === 1 ? channel.toString() + "\r\n" : "0\r\n";
        if (state === 1 && useRelay5 && channel !== 5) {
            await sendDataPayload(encoder.encode("5\r\n"));
            await new Promise(r => setTimeout(r, 30));
            cmdStr = channel.toString() + "\r\n";
        } else if (state === 0 && useRelay5 && activeChannel !== 0 && activeChannel !== 5) {
            await sendDataPayload(encoder.encode("0\r\n"));
            await new Promise(r => setTimeout(r, 30));
            cmdStr = "0\r\n";
        }
        await sendDataPayload(encoder.encode(cmdStr));
        activeChannel = state === 1 ? channel : 0;

    } else if (workMode === "RELAY_A0") {
        const ch = channel & 0xFF;
        const st = state & 0xFF;
        const checksum = (0xA0 + ch + st) & 0xFF;
        let payload = new Uint8Array([0xA0, ch, st, checksum]);

        if (state === 1) {
            if (useRelay5 && channel !== 5) {
                let p5 = new Uint8Array([0xA0, 0x05, 0x01, (0xA0 + 5 + 1) & 0xFF]);
                await sendDataPayload(p5);
                await new Promise(r => setTimeout(r, 30));
            }
            activeChannel = channel;
        } else {
            if (activeChannel !== 0) {
                let pOff = new Uint8Array([0xA0, activeChannel, 0x00, (0xA0 + activeChannel + 0) & 0xFF]);
                await sendDataPayload(pOff);
                if (useRelay5 && activeChannel !== 5) {
                    await new Promise(r => setTimeout(r, 30));
                    let p5Off = new Uint8Array([0xA0, 0x05, 0x00, (0xA0 + 5 + 0) & 0xFF]);
                    await sendDataPayload(p5Off);
                }
                activeChannel = 0;
                return;
            }
        }
        await sendDataPayload(payload);

    } else {
        let payload = state === 1 ? new Uint8Array([channel]) : new Uint8Array([0x00]);
        await sendDataPayload(payload);
    }
}

function sendStopCommand() {
    sendCommand(0, 0);
    activeChannel = 0;
    alert("עצירת מערכת הופעלה.");
}

function emergencyStop() {
    sendStopCommand();
    if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
    }
    isLocked = true;
    updatePinDisplay();
    document.getElementById("statusText").innerText = translations[currentLang].btDisconnected;
    document.getElementById("btIcon").innerText = "🔴";
    document.getElementById("loginSection").classList.remove("hidden");
    document.getElementById("controlSection").classList.add("hidden");
    alert("הופעלה עצירת חירום! המערכת ננעלה ונותקה מהבלוטות'.");
}

// מנגנון כפתורים מוגן נגד תקיעות (Momentary עם שחרור אוטומטי מובטח)
function bindMomentary(btnId, channelCode) {
    const btn = document.getElementById(btnId);
    if (!btn) return;

    const startAction = (e) => {
        e.preventDefault();
        btn.classList.add("active");
        sendCommand(channelCode, 1);
    };

    const stopAction = (e) => {
        e.preventDefault();
        btn.classList.remove("active");
        sendCommand(channelCode, 0);
    };

    btn.addEventListener("touchstart", startAction, { passive: false });
    btn.addEventListener("touchend", stopAction, { passive: false });
    btn.addEventListener("touchcancel", stopAction, { passive: false });

    btn.addEventListener("mousedown", startAction);
    btn.addEventListener("mouseup", stopAction);
    btn.addEventListener("mouseleave", stopAction);
}

// קישור ערוצים לכפתורים: 1=עליה, 2=ירידה, 3=פתיחה (ימין), 4=סגירה (שמאל)
bindMomentary("btnUp", 1);
bindMomentary("btnDown", 2);
bindMomentary("btnOpen", 3);
bindMomentary("btnClose", 4);

changeLanguage(currentLang);
</script>

</body>
</html>
