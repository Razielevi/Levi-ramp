<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levi Ramp - Professional System</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }
        .btn-box {
            background: #1e1e1e;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn-box:active {
            transform: scale(0.98);
        }
        #pinStatusBox {
            border-color: #d4af37;
            background: #1e1e1e;
        }
        /* מעגל השליטה */
        .control-circle {
            position: relative;
            width: 320px;
            height: 320px;
            background: #1a1a1a;
            border: 3px solid #333;
            border-radius: 50%;
            margin: 10px auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .ctrl-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #d4af37;
            background: #252525;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .ctrl-btn:active {
            background: #d4af37;
            color: #121212;
        }
        /* מיקום הלחצנים בעיגול */
        #btnUp { top: 15px; left: 120px; }
        #btnDown { bottom: 15px; left: 120px; }
        #btnOpen { top: 120px; right: 15px; border-color: #3498db; } /* פתיחה בימין */
        #btnClose { top: 120px; left: 15px; border-color: #e74c3c; } /* סגירה בשמאל */
        #btnStop { top: 120px; left: 120px; background: #c0392b; border-color: #e74c3c; border-radius: 50%; width: 80px; height: 80px; }

        /* פס עצירת חירום נוסף למעלה/אמצע */
        .emergency-bar {
            background: #900C3F;
            border: 2px solid #FF5733;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 87, 51, 0.4);
        }
        .emergency-bar:active {
            background: #C70039;
        }

        .footer-info {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        .whatsapp-bar {
            margin-top: 10px;
            background: #25D366;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- סטטוס חיבור ו-PIN -->
        <div id="connectionStatus" class="btn-box" style="color: #f39c12;">מנותק ממערכת הרמפה</div>
        
        <div id="pinStatusBox" class="btn-box" onclick="handlePinClick()">
            <span id="pinText">Security PIN: נעול (לחץ להקשה)</span>
        </div>

        <!-- כפתור חיבור Bluetooth -->
        <button class="btn-box" onclick="connectBluetooth()" style="background: #2c3e50; border-color: #3498db;">חיבור Bluetooth</button>

        <!-- הגדרות מערכת -->
        <button class="btn-box" onclick="openSettings()">⚙️ הגדרות מערכת (שפות / מודולים)</button>

        <!-- פס עצירת חירום ייעודי -->
        <div class="emergency-bar" onclick="emergencyStop()">
            🚨 עצירת חירום / ניתוק מערכת
        </div>

        <!-- מעגל שליטה מרכזי -->
        <div class="control-circle">
            <button id="btnUp" class="ctrl-btn" onclick="sendCommand('UP')">▲<br>עלייה</button>
            <button id="btnClose" class="ctrl-btn" onclick="sendCommand('CLOSE')">◄<br>סגירה</button>
            <button id="btnStop" class="ctrl-btn" onclick="sendCommand('STOP')">STOP</button>
            <button id="btnOpen" class="ctrl-btn" onclick="sendCommand('OPEN')">►<br>פתיחה</button>
            <button id="btnDown" class="ctrl-btn" onclick="sendCommand('DOWN')">▼<br>ירידה</button>
        </div>

        <!-- כותרת ופרטים -->
        <div class="footer-info">
            LEVI RAMP - PROFESSIONAL SYSTEM<br>
            אריק לוי
        </div>

        <!-- שורת וואטסאפ גלויה ובולטת להזמנות -->
        <a href="https://wa.me/972000000000?text=שלום%20אריק,%20אני%20מעוניין%20להזמין%20את%20המערכת%20לרמפה" class="whatsapp-bar" target="_blank">
            💬 לחץ כאן בוואטסאפ להזמנת מערכת / בירורים
        </a>
    </div>

    <script>
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;
        let isLocked = true;
        let currentPin = localStorage.getItem('levi_ramp_pin') || '1960';

        // טיפול בלחיצה על אזור ה-PIN
        function handlePinClick() {
            if (isLocked) {
                let enteredPin = prompt("הקש קוד סודי (ברירת מחדל 1960):");
                if (enteredPin === currentPin) {
                    isLocked = false;
                    updatePinDisplay();
                    alert("המערכת פתוחה לשימוש!");
                } else if (enteredPin !== null) {
                    alert("קוד שגוי!");
                }
            } else {
                let action = prompt("המערכת פתוחה. הקש 1 לנעילה מחדש, או 2 לשינוי קוד אישי:");
                if (action === '1') {
                    isLocked = true;
                    updatePinDisplay();
                    alert("המערכת ננעלה.");
                } else if (action === '2') {
                    let newPin = prompt("הכנס קוד אישי חדש (לפחות 4 ספרות):");
                    if (newPin && newPin.length >= 4) {
                        currentPin = newPin;
                        localStorage.setItem('levi_ramp_pin', currentPin);
                        alert("הקוד האישי עודכן בהצלחה!");
                    } else if (newPin !== null) {
                        alert("הקוד חייב להכיל לפחות 4 תווים.");
                    }
                }
            }
        }

        function updatePinDisplay() {
            const pinText = document.getElementById('pinText');
            if (isLocked) {
                pinText.innerText = "Security PIN: נעול (לחץ להקשת קוד)";
                document.getElementById('pinStatusBox').style.borderColor = "#e74c3c";
            } else {
                pinText.innerText = "Security PIN: פתוח (לחץ לנעילה/שינוי)";
                document.getElementById('pinStatusBox').style.borderColor = "#2ecc71";
            }
        }

        // חיבור Bluetooth עם שמירת מצב בחיבור מחדש
        async function connectBluetooth() {
            try {
                document.getElementById('connectionStatus').innerText = "מחפש התקני Bluetooth...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb'] // שירות נפוץ למודולי BLE
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                bluetoothCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

                document.getElementById('connectionStatus').innerText = "מחובר בהצלחה למערכת הרמפה!";
                document.getElementById('connectionStatus').style.color = "#2ecc71";

                // האזנה לניתוקים אוטומטיים לצורך חיבור מחדש חלקי
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.log("שגיאת חיבור: ", error);
                document.getElementById('connectionStatus').innerText = "החיבור בטל או נכשל";
                document.getElementById('connectionStatus').style.color = "#e74c3c";
            }
        }

        function onDisconnected() {
            document.getElementById('connectionStatus').innerText = "הבלוטות' התנתק. מתחבר אוטומטית...";
            document.getElementById('connectionStatus').style.color = "#f39c12";
            // שומרים על מצב ה-PIN הקיים כדי שהמשתמש לא יצטרך להקיש קוד מחדש כשיתחבר שוב
        }

        // עצירת חירום מלאה וניתוק
        function emergencyStop() {
            sendCommand('STOP');
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            isLocked = true;
            updatePinDisplay();
            document.getElementById('connectionStatus').innerText = "מנותק (עצירת חירום הופעלה)";
            document.getElementById('connectionStatus').style.color = "#e74c3c";
            alert("הופעלה עצירת חירום! המערכת ננעלה ונותקה מהרמפה.");
        }

        // שליחת פקודה לממסר
        async function sendCommand(cmd) {
            if (isLocked) {
                alert("המערכת נעולה! יש ללחוץ על שורת ה-PIN ולהקיש קוד גישה תחילה.");
                return;
            }

            if (!bluetoothCharacteristic) {
                alert("המערכת אינה מחוברת ב-Bluetooth!");
                return;
            }

            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(cmd));
                console.log("נשלחה פקודה: " + cmd);
            } catch (error) {
                console.log("שגיאה בשליחת פקודה: ", error);
                alert("שגיאה בשליחת הפקודה לממסר.");
            }
        }

        function openSettings() {
            let lang = prompt("בחר שפה / Language (HE / EN):", "HE");
            if(lang) {
                alert("ההגדרות עודכנו בהצלחה!");
            }
        }
    </script>
</body>
</html>
