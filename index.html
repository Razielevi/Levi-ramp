<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levi Ramp - Master Controller</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        h2 {
            color: #ffb300;
            margin-bottom: 5px;
            text-align: center;
        }
        #status {
            font-size: 14px;
            color: #00e676;
            margin-bottom: 15px;
            text-align: center;
        }
        /* קנבס ראשי לציור ממשק מותאם אישית אם נדרש */
        #appCanvas {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-main {
            width: 90%;
            max-width: 350px;
            padding: 15px;
            margin: 8px 0;
            background-color: #1e1e1e;
            border: 2px solid #ffb300;
            color: #ffb300;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-main:active {
            background-color: #ffb300;
            color: #121212;
        }
        /* פס הגדרות מערכת */
        .settings-bar {
            width: 90%;
            max-width: 350px;
            padding: 12px;
            margin: 8px 0 15px 0;
            background-color: #1e1e1e;
            border: 1px solid #444;
            color: #ffffff;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .settings-bar:active {
            background-color: #2c2c2c;
        }
        /* ג'ויסטיק עגול לשלט טלוויזיה */
        .joystick {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #1e1e1e;
            border: 4px solid #333;
            display: grid;
            grid-template-areas: 
                ". up ." 
                "left center right" 
                ". down .";
            align-items: center;
            justify-items: center;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            margin: 10px 0;
        }
        .j-btn {
            width: 70px;
            height: 70px;
            background: #2c2c2c;
            border: 2px solid #444;
            color: #ffffff;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .j-btn:active {
            background-color: #ffb300;
            color: #121212;
            border-color: #fff;
        }
        .stop-btn {
            background: #331111;
            border-color: #ff4444;
            color: #ff4444;
            font-size: 12px;
        }
        .stop-btn:active {
            background: #ff4444;
            color: #fff;
        }
        .arrow {
            font-size: 20px;
            margin-bottom: 2px;
        }
        /* כפתור וואטסאפ להזמנות בתחתית */
        .contact-btn {
            width: 90%;
            max-width: 350px;
            padding: 15px;
            margin-top: 15px;
            background-color: #00e676;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: block;
        }
        .brand {
            font-size: 11px;
            color: #666;
            letter-spacing: 2px;
            margin: 15px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Levi Ramp</h2>
    <div id="status">מחפש חיבור Bluetooth...</div>

    <!-- קנבס לניהול וציור גרפיקות דינמיות של המערכת -->
    <canvas id="appCanvas" width="320" height="80"></canvas>

    <!-- חיבור Bluetooth -->
    <div class="btn-main" onclick="connectBluetooth()">
        חיבור Bluetooth
    </div>

    <!-- הגדרות (שפות והתאמת מודולים/ממסרים) -->
    <div class="settings-bar" onclick="openSettingsMenu()">
        ⚙️ הגדרות מערכת (שפות / מודולים)
    </div>

    <!-- ג'ויסטיק עגול לשליטה מלאה בלי תקיעות ממסרים -->
    <div class="joystick">
        <!-- עליה (למעלה) -> ממסר 1 -->
        <div class="j-btn" style="grid-area: up;" onclick="sendSafeCommand('UP')">
            <span class="arrow" style="color: #ffb300;">▲</span>
            עליה
        </div>

        <!-- סגירה (שמאל) -> ממסר 3 -->
        <div class="j-btn" style="grid-area: left;" onclick="sendSafeCommand('CLOSE')">
            <span class="arrow" style="color: #ffb300;">◄</span>
            סגירה
        </div>

        <!-- עצירת חירום למניעת תקיעות ממסרים (מרכז) -->
        <div class="j-btn stop-btn" style="grid-area: center;" onclick="emergencyStopAll()">
            STOP
        </div>

        <!-- פתיחה (ימין) -> ממסר 2 -->
        <div class="j-btn" style="grid-area: right;" onclick="sendSafeCommand('OPEN')">
            <span class="arrow" style="color: #ffb300;">▶</span>
            פתיחה
        </div>

        <!-- ירידה (למטה) -> ממסר 4 -->
        <div class="j-btn" style="grid-area: down;" onclick="sendSafeCommand('DOWN')">
            <span class="arrow" style="color: #ffb300;">▼</span>
            ירידה
        </div>
    </div>

    <div class="brand">LEVI RAMP - PROFESSIONAL SYSTEM</div>

    <!-- כפתור יצירת קשר והזמנות בוואטסאפ (במקום ממסר 5) -->
    <a href="https://wa.me/972500000000?text=שלום%20אריק,%20אני מעוניין בהזמנת מערכת%20Levi%20Ramp" class="contact-btn" target="_blank">
        💬 הזמנות / יצירת קשר עם אריק לווי
    </a>

    <script>
        // משתני ניהול תקשורת והגנה
        let bleDevice = null;
        let bleCharacteristic = null;
        let isProcessingCommand = false; // מנגנון מניעת הצפת ממסרים ("לחיצות פסנתר")
        let securityPin = "1960"; // קוד האבטחה המוגדר למערכת

        // אתחול קנבס וציור אלמנטים ויזואליים של המערכת
        window.onload = function() {
            const canvas = document.getElementById('appCanvas');
            if (canvas.getContext) {
                const ctx = canvas.getContext('2d');
                
                // ציור רקע טכנולוגי בקנבס
                ctx.fillStyle = "#161616";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // מסגרת עדינה
                ctx.strokeStyle = "#ffb300";
                ctx.lineWidth = 1;
                ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
                
                // כתיבת טקסט סטטוס מערכת בתוך הקנבס
                ctx.fillStyle = "#ffb300";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText("MODBUS / BLE RELAY SYSTEM ACTIVE", canvas.width / 2, 35);
                
                ctx.fillStyle = "#00e676";
                ctx.font = "12px Arial";
                ctx.fillText("Security PIN: Locked", canvas.width / 2, 58);
            }
        };

        // התחברות למודל ה-Bluetooth Low Energy
        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "מחפש התקנים בקרבת מקום...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });
                
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                bleCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                
                document.getElementById('status').innerText = "מחובר בהצלחה למערכת הרמפה!";
                document.getElementById('status').style.color = "#00e676";
            } catch (error) {
                console.log('Bluetooth connection error:', error);
                document.getElementById('status').innerText = "מצב סימולציה / לא נמצא בקר פיזי";
            }
        }

        // שליחת פקודה בטוחה המונעת תקיעה או הישארות ממסר פתוח
        async function sendSafeCommand(commandType) {
            if (isProcessingCommand) {
                console.log("Ignored rapid click to protect relays.");
                return; // מונע לחלוטין את בעיית התקיעה בלחיצות מהירות כמו פסנתר
            }

            isProcessingCommand = true;
            console.log("Sending command: " + commandType);

            try {
                if (bleCharacteristic) {
                    const encoder = new TextEncoder();
                    await bleCharacteristic.writeValue(encoder.encode(commandType));
                }
            } catch (err) {
                console.log("Write error:", err);
            }

            // השהיה מבוקרת (Debounce) שמונעת התנגשות זרמים בממסרים
            await new Promise(resolve => setTimeout(resolve, 200));
            
            isProcessingCommand = false;
        }

        // עצירת חירום לניתוק גורף של כל הממסרים 1 עד 4
        async function emergencyStopAll() {
            isProcessingCommand = true;
            console.log("EMERGENCY STOP: Clearing all relays.");
            
            try {
                if (bleCharacteristic) {
                    const encoder = new TextEncoder();
                    await bleCharacteristic.writeValue(encoder.encode("STOP_ALL_RELAYS"));
                }
            } catch (err) {
                console.log("Emergency stop error:", err);
            }

            alert("עצירת חירום הופעלה: כל הממסרים נוקו ונותקו בבטחה!");
            setTimeout(() => {
                isProcessingCommand = false;
            }, 300);
        }

        // תפריט הגדרות מורחב (שפה, ניהול ממסרים למודולים, אבטחה)
        function openSettingsMenu() {
            let pinInput = prompt("הכנס קוד אבטחה למערכת (ברירת מחדל 1960):");
            if (pinInput !== securityPin) {
                if (pinInput !== null) alert("קוד שגוי!");
                return;
            }

            let choice = prompt("תפריט הגדרות Levi Ramp:\n1. שינוי שפה (עברית, English, Русский, العربية)\n2. הצגת מיפוי מודולים וממסרים\n\nבחר אפשרות (1 או 2):", "1");
            
            if (choice === "1") {
                let lang = prompt("בחר שפה מעודכנת (he / en / ru / ar):", "he");
                if (lang) {
                    alert("השפה שונתה בהצלחה.");
                }
            } else if (choice === "2") {
                alert("מיפוי ממסרים נוכחי:\n- ממסר 1 = עליה\n- ממסר 2 = פתיחה (מימין)\n- ממסר 3 = סגירה (משמאל)\n- ממסר 4 = ירידה\n*(ממסר 5 הוסר לחלוטין כפי שביקשת).*");
            }
        }
    </script>

</body>
</html>
