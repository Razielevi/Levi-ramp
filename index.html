<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Levi Ramp - שליטה בממסרים</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 20px; }
        .screen { display: none; }
        .active { display: block; }
        button { padding: 15px 30px; font-size: 20px; margin: 10px; cursor: pointer; border-radius: 10px; border: none; font-weight: bold; }
        .btn-open { background: #4CAF50; color: white; }
        .btn-close { background: #f44336; color: white; }
        .btn-settings { background: #ff9800; color: white; }
        input { padding: 10px; font-size: 16px; width: 80%; max-width: 300px; margin: 10px; border-radius: 5px; border: 1px solid #ccc; text-align: center; }
    </style>
</head>
<body>

    <!-- מסך ראשי - שליטה -->
    <div id="mainScreen" class="screen active">
        <h1>Levi Ramp - שליטה בליפט</h1>
        <p id="connectionStatus" style="color: yellow;">מנותק מבלוטוס</p>
        
        <br>
        <!-- כפתורי פתיחה וסגירה (פתיחה מימין, סגירה משמאל לפי בקשתך) -->
        <div>
            <button class="btn-close" onclick="closeRamp()">סגירה ◀</button>
            <button class="btn-open" onclick="openRamp()">▶ פתיחה</button>
        </div>
        
        <br><br>
        <button class="btn-settings" onclick="showScreen('settingsScreen')">הגדרות ⚙️</button>
        <br>
        <button onclick="connectBluetooth()" style="background: #2196F3; color: white;">התחבר לבלוטוס</button>
    </div>

    <!-- מסך הגדרות -->
    <div id="settingsScreen" class="screen">
        <h1>הגדרות אפליקציה</h1>
        <p>הכנס את כתובת ה-UUID או נתוני החיבור:</p>
        <input type="text" id="serviceUuidInput" placeholder="Service UUID" value="0000ffe0-0000-1000-8000-00805f9b34fb">
        <br>
        <input type="text" id="charUuidInput" placeholder="Characteristic UUID" value="0000ffe1-0000-1000-8000-00805f9b34fb">
        <br><br>
        <button onclick="saveSettings()" style="background: #4CAF50; color: white;">שמור וחזור</button>
        <br>
        <button onclick="showScreen('mainScreen')" style="background: #666; color: white;">חזור בלי לשמור</button>
    </div>

<script>
    let bluetoothDevice;
    let bluetoothCharacteristic;

    // מעבר בין מסכים
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // שמירת הגדרות
    function saveSettings() {
        const serviceUuid = document.getElementById('serviceUuidInput').value;
        const charUuid = document.getElementById('charUuidInput').value;
        
        localStorage.setItem('serviceUuid', serviceUuid);
        localStorage.setItem('charUuid', charUuid);
        
        alert('ההגדרות נשמרו בהצלחה!');
        showScreen('mainScreen');
    }

    // טעינת הגדרות שמורות בהפעלה
    window.onload = function() {
        if(localStorage.getItem('serviceUuid')) {
            document.getElementById('serviceUuidInput').value = localStorage.getItem('serviceUuid');
            document.getElementById('charUuidInput').value = localStorage.getItem('charUuid');
        }
    };

    // חיבור בלוטוס
    async function connectBluetooth() {
        try {
            const serviceUuid = localStorage.getItem('serviceUuid') || '0000ffe0-0000-1000-8000-00805f9b34fb';
            const charUuid = localStorage.getItem('charUuid') || '0000ffe1-0000-1000-8000-00805f9b34fb';

            console.log("מחפש התקן בלוטוס...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [serviceUuid]
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(serviceUuid);
            bluetoothCharacteristic = await service.getCharacteristic(charUuid);

            document.getElementById('connectionStatusinnerText' || 'connectionStatus').innerText = "מחובר בהצלחה! 🟢";
            document.getElementById('connectionStatus').style.color = "#4CAF50";
            alert("הבלוטוס מחובר בהצלחה ללוח!");
        } catch (error) {
            console.error("שגיאה בחיבור:", error);
            alert("החיבור נכשל: " + error);
        }
    }

    // פונקציה לשליחת פקודות Hex לממסרים (כדי שהם באמת ייפתחו!)
    async function sendHexCommand(hexArray) {
        if (!bluetoothCharacteristic) {
            alert("הלוח לא מחובר בבלוטוס! נא להתחבר קודם.");
            return;
        }
        try {
            const data = new Uint8Array(hexArray);
            await bluetoothCharacteristic.writeValue(data);
            console.log("הפקודה נשלחה:", hexArray);
        } catch (error) {
            console.error("שגיאה בשליחת פקודה לממסר:", error);
            alert("שגיאה בשליחת הנתונים לממסר");
        }
    }

    // פתיחה (שליחת פקודה לממסר 1 למשל - אפשר לשנות את הקוד הקסדצימלי לפי הלוח)
    function openRamp() {
        // קוד Hex נפוץ להפעלת ממסר 1 בלוחות ממסרים רגילים
        sendHexCommand([0xA0, 0x01, 0x01, 0xA2]);
    }

    // סגירה (שליחת פקודה לממסר 2)
    function closeRamp() {
        // קוד Hex נפוץ להפעלת ממסר 2 בלוחות ממסרים רגילים
        sendHexCommand([0xA0, 0x02, 0x01, 0xA3]);
    }
</script>

</body>
</html>
