<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levi Ramp - Tail-Lift Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h2 { margin-bottom: 5px; color: #ffc107; }
        #connection-status { font-size: 14px; margin-bottom: 15px; }
        button {
            width: 100%;
            padding: 20px;
            margin: 8px 0;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        /* פתיחה מימין, סגירה משמאל */
        .btn-close { background: #dc3545; color: white; } /* סגירה: ממסר 2+4 */
        .btn-open { background: #28a745; color: white; }  /* פתיחה: ממסר 1+4 */
        .btn-up { background: #ffc107; color: #000; }    /* הרמה: ממסר 3+2 */
        .btn-down { background: #17a2b8; color: white; } /* הורדה: ממסר 3+1 */
        .btn-ble { background: #007bff; color: white; margin-bottom: 10px; padding: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Levi Ramp</h2>
        <p style="color: #aaa; font-size: 13px;">שליטה רגעית (4 ממסרים)</p>
        
        <div id="connection-status" style="color: orange;">מצב: מנותק מ-BLE</div>
        <button class="btn-ble" onclick="connectBLE()">התחבר ל-Bluetooth</button>

        <div class="grid">
            <!-- כפתור סגירה (משמאל) -->
            <button class="btn-close" 
                onmousedown="sendCmd('CLOSE_ON')" onmouseup="sendCmd('STOP')" onmouseleave="sendCmd('STOP')"
                ontouchstart="sendCmd('CLOSE_ON')" ontouchend="sendCmd('STOP')">
                🔒 סגירה<br><small style="font-size:11px;">ממסר 2 + 4</small>
            </button>

            <!-- כפתור פתיחה (מימין) -->
            <button class="btn-open" 
                onmousedown="sendCmd('OPEN_ON')" onmouseup="sendCmd('STOP')" onmouseleave="sendCmd('STOP')"
                ontouchstart="sendCmd('OPEN_ON')" ontouchend="sendCmd('STOP')">
                🔒 פתיחה<br><small style="font-size:11px;">ממסר 1 + 4</small>
            </button>
            
            <!-- כפתור הרמה -->
            <button class="btn-up" 
                onmousedown="sendCmd('UP_ON')" onmouseup="sendCmd('STOP')" onmouseleave="sendCmd('STOP')"
                ontouchstart="sendCmd('UP_ON')" ontouchend="sendCmd('STOP')">
                🔼 הרמה<br><small style="font-size:11px;">ממסר 3 + 2</small>
            </button>

            <!-- כפתור הורדה -->
            <button class="btn-down" 
                onmousedown="sendCmd('DOWN_ON')" onmouseup="sendCmd('STOP')" onmouseleave="sendCmd('STOP')"
                ontouchstart="sendCmd('DOWN_ON')" ontouchend="sendCmd('STOP')">
                🔽 הורדה<br><small style="font-size:11px;">ממסר 3 + 1</small>
            </button>
        </div>
    </div>

    <script>
        let bluetoothDevice;
        let bleCharacteristic;

        async function connectBLE() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                bleCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                
                document.getElementById("connection-status").innerText = "מצב: מחובר בהצלחה ✅";
                document.getElementById("connection-status").style.color = "lightgreen";
            } catch (error) {
                console.error("שגיאת חיבור:", error);
                alert("החיבור נכשל או בוטל.");
            }
        }

        async function sendCmd(action) {
            console.log("פקודה: " + action);
            if (bleCharacteristic) {
                try {
                    const encoder = new TextEncoder();
                    await bleCharacteristic.writeValue(encoder.encode(action));
                } catch (err) {
                    console.error("שגיאה בשליחת נתונים:", err);
                }
            }
        }
    </script>
</body>
</html>
