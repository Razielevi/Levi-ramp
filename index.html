<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levi Ramp - Pro Outdoor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            border-bottom: 3px solid #f39c12;
            margin-bottom: 20px;
        }
        h1 { color: #f39c12; margin: 0; font-size: 32px; text-transform: uppercase; }
        
        .btn-main {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 12px;
            background-color: #2c3e50;
            color: white;
            cursor: pointer;
        }
        
        .cross-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px 0;
        }
        .btn-sq {
            position: absolute;
            width: 130px;
            height: 130px;
            border: 3px solid #ffffff;
            background-color: #27ae60;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 5px 0 #1e8449;
        }
        .btn-sq:active { transform: translateY(4px); box-shadow: none; background-color: #2ecc71; }
        
        .btn-up { top: 0; left: 85px; }
        .btn-down { bottom: 0; left: 85px; }
        .btn-left { top: 85px; left: 0; }
        .btn-right { top: 85px; right: 0; }
        
        #status-bar {
            width: 100%;
            padding: 15px;
            background: #34495e;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>LEVI RAMP</h1></div>
        <div id="status-bar">סטטוס: מנותק</div>
        
        <div class="cross-container">
            <!-- למעלה: הרם (ממסר 3) -->
            <button class="btn-sq btn-up" onclick="sendSafeCommand('UP', 3)">⬆️ הרם</button>
            <!-- שמאל: סגור (ממסר 2) -->
            <button class="btn-sq btn-left" onclick="sendSafeCommand('CLOSE', 2)">⬅️ סגור</button>
            <!-- ימין: פתח (ממסר 1) -->
            <button class="btn-sq btn-right" onclick="sendSafeCommand('OPEN', 1)">פתח ➡️</button>
            <!-- למטה: הורד (ממסר 4) -->
            <button class="btn-sq btn-down" onclick="sendSafeCommand('DOWN', 4)">⬇️ הורד</button>
        </div>
        
        <button class="btn-main" onclick="toggleConnection()">📶 התחבר לבלוטוס BLE</button>
    </div>
    
    <script>
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;
        let isLocked = false;

        async function toggleConnection() {
            try {
                const statusBar = document.getElementById('status-bar');
                if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                    statusBar.innerText = 'סטטוס: מתחבר...';
                    
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                    });
                    const server = await bluetoothDevice.gatt.connect();
                    const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                    bluetoothCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                    
                    statusBar.innerText = 'סטטוס: מחובר בהצלחה';
                } else {
                    await bluetoothDevice.gatt.disconnect();
                    statusBar.innerText = 'סטטוס: מנותק';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('status-bar').innerText = 'סטטוס: שגיאת חיבור';
            }
        }

        async function sendSafeCommand(cmd, relayNum) {
            if (isLocked) return;
            if (!bluetoothCharacteristic) {
                alert('אנא התחבר תחילה לבלוטוס BLE.');
                return;
            }

            isLocked = true;
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(cmd));
                console.log(`נשלחה פקודה ${cmd} (ממסר ${relayNum})`);
                setTimeout(() => { isLocked = false; }, 500);
            } catch (error) {
                console.error('שגיאה בשליחת פקודה:', error);
                isLocked = false;
            }
        }
    </script>
</body>
</html>
