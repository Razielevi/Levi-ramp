    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 16px;
            direction: ltr;
        }
        .card {
            background-color: #1e293b;
            border-radius: 20px;
            padding: 20px;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #334155;
            overflow: hidden;
        }
        
        .truck-header {
            width: 100%;
            height: 150px;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid #00e676;
            margin-bottom: 12px;
        }

        h1 { font-size: 26px; color: #00e676; margin: 4px 0; }
        p { font-size: 14px; color: #94a3b8; margin-top: 0; }
        hr { border: none; border-top: 1px solid #334155; margin: 16px 0; }
        
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        input:focus, select:focus { border-color: #00e676; }
        
        button, .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            text-decoration: none;
            box-sizing: border-box;
        }
        
        .btn-primary { background-color: #0284c7; color: #ffffff; }
        .btn-action { 
            background-color: #00e676; 
            color: #000; 
            font-size: 18px;
            padding: 18px 8px;
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(0,230,118,0.2);
        }
        .btn-action:active, .btn-action.active { background-color: #00a850; transform: scale(0.95); }
        .btn-secondary { background-color: #334155; color: #fff; }
        .btn-whatsapp { background-color: #25d366; color: #ffffff; font-size: 15px; }
        .btn-call { background-color: #e11d48; color: #ffffff; font-size: 15px; }
        .btn-settings { background-color: #64748b; color: #fff; font-size: 14px; padding: 10px; }

        .hidden { display: none !important; }

        .bt-status-box { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px; 
            font-weight: bold; 
            font-size: 16px;
            color: #ffca28; 
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
        }

        .remote-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 10px;
            align-items: center;
            justify-items: center;
            margin: 16px 0;
        }
        .grid-up { grid-column: 2; grid-row: 1; width: 100%; }
        .grid-left { grid-column: 1; grid-row: 2; width: 100%; }
        .grid-right { grid-column: 3; grid-row: 2; width: 100%; }
        .grid-down { grid-column: 2; grid-row: 3; width: 100%; }
        .grid-center { grid-column: 2; grid-row: 2; font-size: 11px; color: #64748b; line-height: 1.2; }

        .order-box {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed #00e676;
            margin-top: 16px;
        }
        .settings-panel {
            background-color: #0f172a;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #0284c7;
            text-align: inherit;
            margin-bottom: 15px;
        }
        .settings-panel label { font-size: 13px; color: #cbd5e1; display: block; margin-top: 8px; }

<div class="card">

        <div id="loginError" style="color:#ff5252; margin-top:8px;"></div>
    </div>

    <!-- Screen 2: Control & Settings -->
    <div id="controlSection" class="hidden">

        <div class="bt-status-box">
            <span id="btIcon">🔴</span>
            <span id="statusText">Bluetooth Disconnected</span>
        </div>

        <button class="btn-settings" onclick="toggleSettings()" id="t-settingsBtn">⚙️ Settings & Language</button>

        <!-- Settings Panel -->
        <div id="settingsPanel" class="settings-panel hidden">
            <h4 style="margin:0 0 10px 0; color:#0284c7; text-align:center;" id="t-settingsTitle">Module & System Settings</h4>
            
            <label id="t-langLabel">Language / שפה:</label>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="he">עברית (Hebrew)</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="es">Español (Spanish)</option>
                <option value="ru">Русский (Russian)</option>
                <option value="fr">Français (French)</option>
                <option value="de">Deutsch (German)</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="tr">Türkçe (Turkish)</option>
            </select>

            <label id="t-modeLabel">Transmission Protocol (Module Mode):</label>
            <select id="modeSelect" onchange="saveSettings()">
                <option value="HEX">HEX Mode (Bytes - Module X)</option>
                <option value="ASCII">ASCII Mode (Text String)</option>
            </select>

            <label id="t-relay5Label">Master Relay #5 Dual Trigger:</label>
            <select id="relay5Select" onchange="saveSettings()">
                <option value="true" id="t-r5Yes">YES - Trigger Relay #5 with every action</option>
                <option value="false" id="t-r5No">NO - Single Relay mode</option>
            </select>

            <button class="btn-secondary" style="padding:8px; margin-top:12px; font-size:14px;" onclick="toggleSettings()" id="t-closeSettings">Close Settings</button>
        </div>
        
        <hr>
        
        <!-- Directional Remote Grid -->
        <div class="remote-grid">
            <div class="grid-up">
                <button class="btn-action" id="btnUp">⬆️<br><span id="t-btnUp">UP</span></button>
            </div>
            
            <div class="grid-left">
                <button class="btn-action" id="btnLeft">⬅️<br><span id="t-btnLeft">OPEN</span></button>
            </div>

            <div class="grid-center">
                <span>LEVI<br>RAMP<br><b id="modeDisplay">HEX</b></span>
            </div>

            <div class="grid-right">
                <button class="btn-action" id="btnRight">➡️<br><span id="t-btnRight">CLOSE</span></button>
            </div>

            <div class="grid-down">
                <button class="btn-action" id="btnDown">⬇️<br><span id="t-btnDown">DOWN</span></button>
            </div>
        </div>
        
        <hr>
        
        <!-- Change Passcode -->
        <h4 id="t-changePinTitle">Change Passcode</h4>
        <input type="password" id="newPinInput" placeholder="New PIN (4 digits)" maxlength="8" inputmode="numeric">
        <button class="btn-secondary" onclick="changePin()" id="t-updatePinBtn">Update Passcode</button>
        
        <!-- Order & Support Box -->
        <div class="order-box">
            <h4 style="margin:0 0 6px 0; color:#00e676;" id="t-supportTitle">Order & Technical Support</h4>
            <p style="margin-bottom: 8px; color: #e2e8f0;">Tel: +972-52-3401960</p>

            <a href="https://wa.me/972523401960" target="_blank" class="btn-link btn-whatsapp" id="t-waBtn">💬 Contact on WhatsApp</a>
        </div>

</div>

            supportTitle: "Sipariş ve Teknik Destek",
            callBtn: "📞 Şimdi Ara",
            waBtn: "💬 WhatsApp'tan Ulaşın",
            wrongPin: "Hatalı kod, tekrar deneyin",
            pinSuccess: "Kod başarıyla güncellendi!",
            pinMin: "Kod en az 4 haneli olmalıdır"
        }
    };

    // Load saved configurations
    try {
        savedPin = localStorage.getItem("user_pin") || DEFAULT_PIN;
        workMode = localStorage.getItem("work_mode") || "HEX";
        useRelay5 = localStorage.getItem("use_relay5") !== "false";
        currentLang = localStorage.getItem("app_lang") || "en";
    } catch (e) {}

    document.getElementById("modeSelect").value = workMode;
    document.getElementById("relay5Select").value = useRelay5 ? "true" : "false";
    document.getElementById("langSelect").value = currentLang;
    document.getElementById("modeDisplay").innerText = workMode;

    function changeLanguage(lang) {
        if (!translations[lang]) lang = "en";
        currentLang = lang;
        const t = translations[lang];

        document.body.dir = t.dir;
        
        document.getElementById("t-subtitle").innerText = t.subtitle;
        document.getElementById("t-loginTitle").innerText = t.loginTitle;
        document.getElementById("t-passHint").innerText = t.passHint;
        document.getElementById("t-loginBtn").innerText = t.loginBtn;
        document.getElementById("t-connectBt").innerText = t.connectBt;
        
        if (!relayCharacteristic) {
            document.getElementById("statusText").innerText = t.btDisconnected;
        }

        document.getElementById("t-settingsBtn").innerText = t.settingsBtn;
        document.getElementById("t-settingsTitle").innerText = t.settingsTitle;
        document.getElementById("t-langLabel").innerText = t.langLabel;
        document.getElementById("t-modeLabel").innerText = t.modeLabel;
        document.getElementById("t-relay5Label").innerText = t.relay5Label;
        document.getElementById("t-r5Yes").innerText = t.r5Yes;
        document.getElementById("t-r5No").innerText = t.r5No;
        document.getElementById("t-closeSettings").innerText = t.closeSettings;
        
        document.getElementById("t-btnUp").innerText = t.btnUp;
        document.getElementById("t-btnDown").innerText = t.btnDown;
        document.getElementById("t-btnLeft").innerText = t.btnLeft;
        document.getElementById("t-btnRight").innerText = t.btnRight;
        
        document.getElementById("t-changePinTitle").innerText = t.changePinTitle;
        document.getElementById("t-updatePinBtn").innerText = t.updatePinBtn;
        document.getElementById("t-supportTitle").innerText = t.supportTitle;
        document.getElementById("t-callBtn").innerText = t.callBtn;
        document.getElementById("t-waBtn").innerText = t.waBtn;

        try { localStorage.setItem("app_lang", lang); } catch(e) {}
    }

    function toggleSettings() {
        document.getElementById("settingsPanel").classList.toggle("hidden");
    }

    function saveSettings() {
        workMode = document.getElementById("modeSelect").value;
        useRelay5 = document.getElementById("relay5Select").value === "true";
        document.getElementById("modeDisplay").innerText = workMode;
        
        try {
            localStorage.setItem("work_mode", workMode);
            localStorage.setItem("use_relay5", useRelay5);
        } catch(e) {}
    }

    function checkPin() {
        const input = document.getElementById("pinInput").value;
        const errorDiv = document.getElementById("loginError");
        const t = translations[currentLang];

        if (input === savedPin) {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("controlSection").classList.remove("hidden");
            errorDiv.innerText = "";
            setupButtons();
        } else {
            errorDiv.innerText = t.wrongPin;
        }
    }

    function changePin() {
        const newPin = document.getElementById("newPinInput").value;
        const t = translations[currentLang];

        if (newPin.length >= 4) {
            try { localStorage.setItem("user_pin", newPin); } catch(e) {}
            savedPin = newPin;
            alert(t.pinSuccess);
            document.getElementById("newPinInput").value = "";
        } else {
            alert(t.pinMin);
        }
    }

    let bluetoothDevice;
    let relayCharacteristic;

    async function connectBluetooth() {
        const statusText = document.getElementById("statusText");
        const btIcon = document.getElementById("btIcon");
        const t = translations[currentLang];
        
        if (!navigator.bluetooth) {
            alert("Please open this app in Google Chrome on Android or Desktop.");
            return;
        }

        try {
            statusText.innerText = t.btSearching;
            btIcon.innerText = "🟡";
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
            });

            statusText.innerText = t.btConnecting;
            const gattServer = await bluetoothDevice.gatt.connect();
            const relayService = await gattServer.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
            relayCharacteristic = await relayService.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

            statusText.innerText = t.btConnected;
            statusText.style.color = "#00e676";
            btIcon.innerText = "🟢";

            bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                statusText.innerText = translations[currentLang].btDisconnected;
                statusText.style.color = "#ff5252";
                btIcon.innerText = "🔴";
                relayCharacteristic = null;
            });
        } catch (error) {
            console.error(error);
            statusText.innerText = t.btError;
            statusText.style.color = "#ff5252";
            btIcon.innerText = "🔴";
        }
    }

    async function sendCommand(code) {
        if (!relayCharacteristic) return;

        try {
            let data;
            if (workMode === "HEX") {
                if (code === 0) {
                    data = new Uint8Array([0x00]);
                } else {
                    data = useRelay5 ? new Uint8Array([0x05, code]) : new Uint8Array([code]);
                }
            } else {
                const encoder = new TextEncoder();
                let str = code.toString();
                if (code !== 0 && useRelay5) str = "5" + str;
                data = encoder.encode(str);
            }
            await relayCharacteristic.writeValue(data);
        } catch (e) {
            console.log("Transmission Error:", e);
        }
    }

    function bindMomentary(btnId, code) {
        const btn = document.getElementById(btnId);
        if (!btn) return;

        const start = (e) => {
            e.preventDefault();
            btn.classList.add("active");
            sendCommand(code);
        };

        const stop = (e) => {
            e.preventDefault();
            btn.classList.remove("active");
            sendCommand(0);
        };

        btn.addEventListener("touchstart", start, { passive: false });
        btn.addEventListener("touchend", stop, { passive: false });
        btn.addEventListener("touchcancel", stop, { passive: false });

        btn.addEventListener("mousedown", start);
        btn.addEventListener("mouseup", stop);
        btn.addEventListener("mouseleave", stop);
    }

    function setupButtons() {
        bindMomentary("btnUp", 1);
        bindMomentary("btnDown", 2);
        bindMomentary("btnLeft", 3);
        bindMomentary("btnRight", 4);
    }

    // Initialize Language on Startup
    changeLanguage(currentLang);
</script>

</body>
</html>
