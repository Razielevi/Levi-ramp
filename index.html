<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Levi Ramp Control</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            padding-bottom: 20px;
        }
        header { width: 100%; padding: 15px 0; text-align: center; background: #1e1e1e; }
        header h1 { margin: 0; font-size: 18px; color: #ff9800; }
        #status { font-size: 12px; color: #888; margin-top: 4px; padding: 0 10px; word-wrap: break-word; }
        .error-text { color: #ff5252 !important; font-weight: bold; }
 
        .section { width: 320px; margin-top: 16px; }
 
        .connect-btn {
            width: 100%;
            padding: 14px 0;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: center;
        }
        .connect-btn.connected { border-color: #ff9800; color: #ff9800; }
 
        .dpad {
            direction: ltr;
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
            gap: 6px;
            justify-content: center;
        }
        .dpad-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: #fff;
            touch-action: none;
        }
        .dpad-btn .arrow { font-size: 30px; line-height: 1; color: #ff9800; }
        .dpad-btn .txt { font-size: 12px; margin-top: 4px; color: #ccc; }
        .dpad-btn.active { background: #3d3d3d; border-color: #ff9800; }
 
        .dpad-up    { grid-column: 2; grid-row: 1; }
        .dpad-left  { grid-column: 1; grid-row: 2; }
        .dpad-center{ grid-column: 2; grid-row: 2; display:flex; align-items:center; justify-content:center; }
        .dpad-center span { font-size: 10px; color: #555; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down  { grid-column: 2; grid-row: 3; }
 
        .relay-btn {
            width: 100%;
            padding: 16px 0;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            text-align: center;
            touch-action: none;
        }
        .relay-btn.active { background: #3d3d3d; border-color: #ff9800; }
 
        .contact-row { display: flex; gap: 10px; }
        .contact-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 12px 0; font-size: 14px; font-weight: bold;
            border-radius: 8px; text-decoration: none; border: 1px solid #3a3a3a;
        }
        .contact-btn.call { background: #2a2a2a; color: #4FC3F7; }
        .contact-btn.whatsapp { background: #2a2a2a; color: #25D366; }
 
        footer { margin-top: auto; padding-top: 16px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
 
    <header>
        <h1>Levi Ramp</h1>
        <div id="status">מנותק</div>
    </header>
 
    <div class="section">
        <div id="connectBtn" class="connect-btn">חיבור Bluetooth</div>
    </div>
 
    <div class="section">
        <div class="dpad">
            <div class="dpad-btn dpad-up" id="btn-up" data-cmd="UP_CMD" data-vibrate="1">
                <span class="arrow">&#9650;</span>
                <span class="txt">עלייה</span>
            </div>
            <div class="dpad-btn dpad-left" id="btn-close" data-cmd="CLOSE_CMD" data-vibrate="1">
                <span class="arrow">&#9664;</span>
                <span class="txt">סגירה</span>
            </div>
            <div class="dpad-center"><span>LEVI</span></div>
            <div class="dpad-btn dpad-right" id="btn-open" data-cmd="OPEN_CMD" data-vibrate="1">
                <span class="arrow">&#9654;</span>
                <span class="txt">פתיחה</span>
            </div>
            <div class="dpad-btn dpad-down" id="btn-down" data-cmd="DOWN_CMD" data-vibrate="1">
                <span class="arrow">&#9660;</span>
                <span class="txt">ירידה</span>
            </div>
        </div>
    </div>
 
    <div class="section">
        <div id="btn-relay5" class="relay-btn" data-cmd="RELAY5_CMD">ממסר ראשי #5</div>
    </div>
 
    <div class="section contact-row">
        <a class="contact-btn call" href="tel:0523401960">&#128222; התקשרות</a>
        <a class="contact-btn whatsapp" href="https://wa.me/972523401960" target="_blank">&#128172; וואטסאפ</a>
    </div>
 
    <footer>אריק לוי | 052-3401960</footer>
 
    <script>
        const statusEl = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
 
        let isConnected = false;
        let bleChar = null;
        let isSending = false;
        let sendQueue = [];
 
        const commandButtons = [
            document.getElementById('btn-up'),
            document.getElementById('btn-down'),
            document.getElementById('btn-open'),
            document.getElementById('btn-close'),
            document.getElementById('btn-relay5')
        ];
 
        function showError(msg) {
            statusEl.innerText = msg;
            statusEl.classList.add('error-text');
        }

        function showStatus(msg) {
            statusEl.innerText = msg;
            statusEl.classList.remove('error-text');
        }

        async function connect() {
            try {
                showStatus('מתחבר...');
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{services: ['0000ffe0-0000-1000-8000-00805f9b34fb']}]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                bleChar = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                
                device.addEventListener('gattserverdisconnected', () => {
                    isConnected = false;
                    showError('החיבור נותק מהמכשיר');
                    connectBtn.classList.remove('connected');
                    bleChar = null;
                });

                isConnected = true;
                showStatus('מחובר בהצלחה!');
                connectBtn.classList.add('connected');
            } catch(e) { 
                showError('שגיאת חיבור: ' + e.message); 
            }
        }
 
        async function processQueue() {
            if (isSending || sendQueue.length === 0 || !isConnected || !bleChar) return;
            
            isSending = true;
            const data = sendQueue.shift();
            
            try {
                // ננסה קודם את השיטה שמתאימה לרוב מודולי הבלוטות' הסיניים (HM-10)
                if (bleChar.writeValueWithoutResponse) {
                    await bleChar.writeValueWithoutResponse(data);
                } else {
                    await bleChar.writeValue(data);
                }
            } catch (e1) {
                try {
                    await bleChar.writeValue(data);
                } catch (e2) {
                    showError('שגיאה בשליחה: ' + e2.message);
                }
            }
            
            isSending = false;
            processQueue();
        }

        function send(cmd, state) {
            if(!isConnected) {
                showError('יש להתחבר לבלוטות׳ תחילה');
                return;
            }
            if(!bleChar) return;
            
            // שליחת הפקודה בדיוק כפי שהייתה בקוד המקורי שלך, ללא תוספות
            const msg = cmd + '_' + state;
            const data = new TextEncoder().encode(msg);
            
            sendQueue.push(data);
            processQueue();
        }
 
        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(40);
        }
 
        connectBtn.addEventListener('click', connect);
 
        commandButtons.forEach(btn => {
            const cmd = btn.dataset.cmd;
            const shouldVibrate = btn.dataset.vibrate === '1';
 
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (shouldVibrate) vibrate();
                btn.classList.add('active');
                send(cmd, 'ON');
            });
 
            const release = () => {
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    send(cmd, 'OFF');
                }
            };
 
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('pointercancel', release);
        });
    </script>
</body>
</html>
